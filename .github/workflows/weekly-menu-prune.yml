name: Weekly Menu Prune

# Dispatched by the scheduler Worker in worker/ on Sundays at 23:00 Europe/Zurich.
on:
  workflow_dispatch:

jobs:
  prune-old-menus:
    name: Prune Old Menu Files
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
      CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
      CLOUDFLARE_BUCKET_NAME: ${{ secrets.CLOUDFLARE_BUCKET_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run pruning script
        run: |
          chmod +x ./scripts/prune-menus.sh
          bash ./scripts/prune-menus.sh --yes

      - name: Report success to healthchecks
        if: success()
        run: curl -fsS -m 10 --retry 3 '${{ secrets.HC_PING_MENU_PRUNE }}'

      - name: Report failure to healthchecks
        if: failure()
        run: curl -fsS -m 10 --retry 3 '${{ secrets.HC_PING_MENU_PRUNE }}/fail'